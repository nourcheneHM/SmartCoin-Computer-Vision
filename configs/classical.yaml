# Paramètres de l'approche classique (sans IA).
# Valeurs INITIALES à tester, pas des valeurs définitives :
# elles sont réglées sur les images de développement (data/raw/group, data/raw/new/train),
# JAMAIS sur data/raw/new/test.

preprocessing:
  max_side: 1024               # plus grand côté après redimensionnement (pixels)
  blur: median                 # median | gaussian
  blur_ksize: 7                # noyau impair ; plus grand = efface mieux la texture du tissu
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]

detection:
  method: hybrid               # hough | segmentation | hybrid (fusion des deux)
  segmentation:                # soustraction du fond (Lab) + Otsu + morphologie + distance
    border_ratio: 0.03         # largeur de la bande de bord servant à estimer le fond
    l_weight: 0.5              # poids de la luminance L (< 1 : moins sensible aux ombres)
    blur_ksize: 7
    morph_ksize: 7
    min_radius_ratio: 0.03
    max_radius_ratio: 0.50
  hough:                       # cv2.HOUGH_GRADIENT_ALT
    dp: 1.5                    # résolution de l'accumulateur (1.5 recommandé pour ALT)
    param1: 150                # seuil haut de Canny interne
    param2: 0.80               # perfection du cercle (0-1) ; plus haut = moins de faux cercles
    min_dist_ratio: 0.04       # distance min. entre centres / plus petit côté
    min_radius_ratio: 0.03     # rayon min. / plus petit côté
    max_radius_ratio: 0.50     # rayon max. / plus petit côté (gros plans de group/)

classification:
  # Valeurs choisies sur les images de DÉVELOPPEMENT uniquement :
  # - pièces seules (raw/group + train/L1, 246 pièces) : `python -m src.classical.calibrate` ;
  # - photos multi-pièces train/L2-L4 (55 images, 364 pièces, contenu_train.csv) :
  #   évaluation par comptage `python -m src.evaluation.count_metrics`.
  # Voir src/classical/classification.py.
  bimetal_min_contrast: 7.0    # pièces seules : 5 D >= 9, autres <= 7 ; 7 retenu sur L2-L4 (plus de 5 D retrouvés)
  reference_offset: 2.0        # seuil doré/argenté = milieu centre/anneau du 5 D + décalage (L2-L4)
  background_alpha: 0.75       # b corrigé = b - alpha * b_fond (14 erreurs/227 contre 41 sans correction)
  gold_threshold: 13.5         # b corrigé > seuil => doré (images sans 5 D ni deux groupes nets)
  split_min_gap: 10.0          # écart min. entre groupes doré/argenté d'une même image (L2-L4 : métal correct 319/364 contre 246 sans comparaison relative)
  polygon_min_score: 3.5       # 13 côtés : rappel 71 % (200 mill.), 36 % (2 D) ; 2/179 faux positifs
  scale_prior_px_per_mm_per_side: 0.0099   # médiane mesurée sur L1 (min 0.0079, max 0.0115)
  scale_prior_weight: 0.005    # faible : ne sert qu'à départager des échelles équivalentes
  scale_steps: 600
  error_cap: 0.15              # erreur log max. comptée par pièce (robustesse)
  max_relative_error: 0.07     # au-delà, diamètre incompatible => inconnue
  confidence_tau: 0.004
  min_confidence: 0.0          # 0 = confiance affichée seulement (L2-L4 : 0,5 => 221 pièces correctes contre 274 avec 0)
  unknown_label: unknown
